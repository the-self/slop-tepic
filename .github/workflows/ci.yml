# Type-check (strict), lint, test and bundle every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm test
        working-directory: server
      - run: npm run build
