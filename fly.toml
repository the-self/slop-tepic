# fly.toml
# The game and its room server on Fly.io (server/README.md, "Deploy"): one machine, always on (the rooms live in its
# memory, so it is never stopped for being idle, nor doubled: two machines would be two separate worlds), the
# profiles on a volume. `app` has to be a name of your own: fly launch offers one.
app = "slop-tepic"
primary_region = "qro" # Querétaro, the nearest to Tepic (fly platform regions lists the others)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  STATIC_DIR = "/app"
  DATA_DIR = "/data"
  ROOM_CAPACITY = "200"
  TRUST_PROXY = "1" # (Fly's proxy says who connected, Fly-Client-IP: the bans go by it)

[[mounts]]
  source = "slop_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 4500
    hard_limit = 5000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
